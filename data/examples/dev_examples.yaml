      Facts stated: Petroleum stream; Water content requested; Independent
      laboratory water measurement exists; Analyzer outside the process area.
      Useful sources: S01 p.6, 9, 10; S02 p.6, 13
    reference_answer: null

  - example_id: D07
    provenance: "AFS_Examples_and_Reference.docx \u00a71 development scenario"
    query: |
      API concentration during hot polymer extrusion. We are developing a hot
      polymer extrusion process that incorporates an active pharmaceutical
      ingredient. We want to investigate whether an optical measurement can
      detect composition changes while the melt is being processed. We have
      offline assays, but the process interface is hot and may be exposed to
      material build up. We need an initial comparison plan and the questions
      required before choosing a probe.
      Facts stated: Hot polymer melt; API composition changes requested; Offline
      assays available; Interface may foul.
      Useful sources: S01 p.5, 6, 10; S02 p.14
    reference_answer: null

  - example_id: D08
    provenance: "AFS_Examples_and_Reference.docx \u00a71 development scenario"
    query: |
      Local measurements of heterogeneous model tissues. Our research group is
      evaluating a spectral measurement interface using model biological tissues
      such as chicken muscle, fat and liver. We want to compare MIR ATR and
      fluorescence information, because the material is heterogeneous and
      sequential measurements may not sample the same location. This is a
      laboratory classification study. We need a first comparison experiment and
      a clear statement of what its results would demonstrate.
      Facts stated: Laboratory model tissues; Chicken muscle, fat and liver are
      examples; Heterogeneous sample; Compare measurements from the same local
      area; No clinical use requested.
      Useful sources: S01 p.5, 6, 8-10; S04 p.1, 3, 4
    reference_answer: null
